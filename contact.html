<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お問い合わせ｜きのくに焙煎所</title>
<meta name="description" content="きのくに焙煎所へのお問い合わせ。豆の選び方、ギフト、業務用のご相談など、お気軽にどうぞ。">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Zen+Maru+Gothic:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-contact">

<header class="site-header">
  <div class="inner header-inner">
    <a class="logo" href="index.html">
      <img src="images/squirrel.png" alt="" width="58" height="42">
      <span class="logo-text"><span class="logo-ja">きのくに焙煎所</span><span class="logo-en">KINOKUNI ROASTERY</span></span>
    </a>
    <a class="header-shop js-stores" href="#" target="_blank" rel="noopener"><span class="shop-long">オンライン</span>ショップ</a>
    <button class="menu-btn" type="button" id="menu-btn" aria-expanded="false" aria-controls="global-nav">
      <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span><span class="menu-label">メニュー</span>
    </button>
    <nav class="global-nav" id="global-nav" aria-label="サイトメニュー">
      <ul>
        <li><a href="index.html">トップ</a></li>
        <li><a href="index.html#about">焙煎所について</a></li>
        <li><a href="kinoko.html">きの子について</a></li>
        <li><a href="blend.html">ブレンド</a></li>
        <li><a href="single.html">シングルオリジン</a></li>
        <li><a href="roast.html">焙煎のこだわり</a></li>
        <li><a href="contact.html" aria-current="page">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <!-- ページタイトル -->
  <section class="page-hero">
    <svg class="hero-canopy" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
      <g fill="#22372A"><circle cx="40" cy="10" r="80"/><circle cx="160" cy="-20" r="90"/><circle cx="290" cy="20" r="66"/><circle cx="410" cy="-20" r="84"/><circle cx="540" cy="10" r="60"/><circle cx="660" cy="-30" r="90"/><circle cx="790" cy="15" r="70"/><circle cx="910" cy="-15" r="86"/><circle cx="1030" cy="20" r="64"/><circle cx="1140" cy="-10" r="88"/></g>
      <g fill="#3E5E45"><circle cx="220" cy="40" r="34"/><circle cx="600" cy="44" r="30"/><circle cx="850" cy="52" r="32"/><circle cx="1080" cy="44" r="28"/></g>
    </svg>
    <div class="inner page-hero-inner">
      <nav class="breadcrumb" aria-label="現在の位置"><a href="index.html">トップ</a><span aria-hidden="true">›</span><span>お問い合わせ</span></nav>
      <div class="page-hero-body">
        <div class="page-hero-text">
          <p class="section-en">Contact</p>
          <h1 class="page-title">お問い合わせ</h1>
          <p class="page-intro">豆の選び方、ギフト、業務用のご相談など、お気軽にどうぞ。</p>
        </div>
        <img class="page-hero-squirrel" src="images/squirrel.png" alt="" width="260" height="190">
      </div>
    </div>
  </section>

  <!-- お問い合わせフォームと店舗情報 -->
  <section id="contact" class="section contact-page-section">
    <div class="inner">
      <div class="contact-grid">
        <form class="contact-form" id="contact-form" novalidate>
          <div class="field">
            <label for="f-name">お名前 <span class="req">必須</span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" placeholder="森野 くるみ">
          </div>
          <div class="field">
            <label for="f-email">メールアドレス <span class="req">必須</span></label>
            <input id="f-email" name="email" type="email" autocomplete="email" placeholder="example@mail.jp">
          </div>
          <div class="field">
            <label for="f-type">お問い合わせの種類</label>
            <select id="f-type" name="type">
              <option>商品・豆の選び方について</option>
              <option>ギフトについて</option>
              <option>卸・業務用について</option>
              <option>その他</option>
            </select>
          </div>
          <div class="field">
            <label for="f-message">お問い合わせ内容 <span class="req">必須</span></label>
            <textarea id="f-message" name="message" rows="6" placeholder="例：酸味が苦手です。おすすめの豆を教えてください。"></textarea>
          </div>
          <p class="form-status" id="form-status" role="status" hidden></p>
          <button class="btn btn-primary" type="submit">送信する</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="inner footer-inner">
    <a class="logo logo-light" href="index.html">
      <img src="images/squirrel.png" alt="" width="40" height="40" loading="lazy">
      <span class="logo-text"><span class="logo-ja">きのくに焙煎所</span><span class="logo-en">KINOKUNI ROASTERY</span></span>
    </a>
    <nav class="footer-nav" aria-label="フッターメニュー"><a href="index.html">トップ</a><a href="blend.html">ブレンドコーヒー</a><a href="single.html">シングルオリジン</a><a href="roast.html">焙煎のこだわり</a><a href="kinoko.html">きの子について</a><a href="contact.html">お問い合わせ</a></nav>
    <p class="copyright">© <span id="year">2026</span> きのくに焙煎所</p>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/main.js"></script>
</body>
</html>
